# =============================================================================
# Deploy SDDV web — GitHub Pages
#
# Publica el frontend estatico en https://milliyx.github.io/Cryptography
#
# Decision de diseno clave: "zero-divergence" entre CLI y frontend
# ----------------------------------------------------------------
# El paso "Stage site" copia LITERALMENTE el directorio `src/` del repo
# junto al frontend. Esto garantiza que el codigo Python que ejecuta
# Pyodide en el navegador sea EXACTAMENTE el mismo que el que cubren los
# 300 tests del backend. Si en algun momento cambia `src/aead.py`, esa
# misma version sale al navegador al siguiente push a main.
#
# Alternativas consideradas (y rechazadas):
# - Tener una copia de `src/` en `web/frontend/src/`: duplica el
#   codigo y abre la puerta a divergencias.
# - Reimplementar en JavaScript: rompe el principio de "una sola fuente
#   de verdad" criptografica y obligaria a duplicar los tests.
# =============================================================================
name: Deploy SDDV web

on:
  push:
    # Despliega tanto desde main como desde la rama de desarrollo del frontend.
    # IMPORTANTE: cualquier push a feature/web-ui sobreescribe la version
    # publica — manejar con cuidado.
    branches: [main, feature/web-ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          # 1) Copia el frontend (HTML/CSS/JS + sddv_api.py + pyodide-runtime.js)
          cp -r web/frontend/. _site/
          # 2) Copia el modulo src/ del repo TAL CUAL — zero-divergence.
          #    Pyodide lo descarga via fetch("./src/<modulo>.py") al
          #    filesystem virtual y lo importa como cualquier paquete Python.
          cp -r src _site/src
          # 3) Genera _manifest.json con la lista de .py para que el frontend
          #    haga auto-discovery en vez de mantener una lista hardcoded.
          #    Excluye __pycache__ y archivos auxiliares.
          python3 -c "
          import json, os
          base = '_site/src'
          files = sorted([
              f for f in os.listdir(base)
              if f.endswith('.py') and not f.startswith('_pycache')
          ])
          # Asegurar que __init__.py va primero si existe
          if '__init__.py' in files:
              files.remove('__init__.py')
              files.insert(0, '__init__.py')
          with open(f'{base}/_manifest.json', 'w') as fp:
              json.dump({'files': files, 'version': 1}, fp, indent=2)
          print(f'Manifest generado con {len(files)} archivos:')
          for f in files: print(f'  - {f}')
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
